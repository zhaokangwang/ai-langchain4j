<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号登录 · 知序</title><link rel="stylesheet" href="css/auth.css">
  <script defer src="vendor/vue.global.prod.js"></script><script defer src="js/auth.js"></script><script defer src="js/auth-page.js"></script>
</head>
<body data-auth-page="login">
<main id="auth" class="auth-layout" v-cloak>
  <section class="auth-intro"><a class="auth-brand" href="/">知序<span>AI SERVICE DESK</span></a><div><p class="eyebrow">欢迎回来</p><h1>从一次登录，<br>开始顺畅的协作。</h1><p>让订单查询、售后服务与仓库协作，<br>在熟悉的对话中展开。</p></div><span class="intro-foot">知序 · 模拟业务工作台</span></section>
  <section class="auth-panel"><div class="auth-card"><p class="eyebrow">ACCOUNT LOGIN</p><h2>登录你的账号</h2><p class="muted">使用管理员为你创建的账号登录。</p>
    <p v-if="notice" class="notice" role="status">{{ notice }}</p><p v-if="loading" class="muted" role="status">正在检查登录状态…</p><p v-if="error" class="form-error" role="alert">{{ error }}</p>
    <form @submit.prevent="submit">
      <label for="username">账号<input id="username" name="username" v-model="username" autocomplete="username" minlength="3" maxlength="64" required autofocus :disabled="busy || loading"></label>
      <label for="password">密码<input id="password" name="password" type="password" v-model="password" autocomplete="current-password" minlength="4" maxlength="72" required :disabled="busy || loading"></label>
      <button class="primary" type="submit" :disabled="busy || loading">{{ busy ? '正在登录…' : '登录' }} <span aria-hidden="true">↗</span></button>
    </form><p class="auth-footnote">账号由管理员维护。无法登录时，请联系管理员。</p>
  </div></section>
</main><p id="auth-boot-error" class="boot-error" hidden>页面组件加载失败，请刷新重试。</p><noscript><p>请启用 JavaScript 后登录。</p></noscript>
</body></html>
